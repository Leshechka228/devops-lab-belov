name: CI Pipeline
on:
  push:
    branches: [ main, master, develop, github-actions ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Линтинг Dockerfile (опционально - задание 3.4)
  docker-lint:
    runs-on: ubuntu-latest
    name: Lint Dockerfile
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ./Dockerfile
        failure-threshold: warning

  # Сборка Docker образа (основное задание 3.3-3.4)
  docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          ghcr.io/leshechka228/devops-lab:latest
          ghcr.io/leshechka228/devops-lab:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify build
      run: |
        echo "✅ Docker image built successfully"
        echo "📦 Image would be pushed to: ghcr.io/leshechka228/devops-lab"
