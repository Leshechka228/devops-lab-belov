name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate shell scripts
      run: |
        echo "Validating shell scripts..."
        find . -name "*.sh" -type f | while read script; do
          echo "Checking $script"
          if bash -n "$script"; then
            echo "✅ $script - syntax OK"
          else
            echo "❌ $script - syntax error"
          fi
        done
        
    - name: Check file permissions
      run: |
        echo "Setting executable permissions..."
        find . -name "*.sh" -type f -exec chmod +x {} \;
        echo "✅ All shell scripts are now executable"
        
    - name: Test deployment scripts
      run: |
        echo "Testing deployment scripts..."
        [ -f "deploy.sh" ] && echo "✅ deploy.sh exists" || echo "❌ deploy.sh missing"
        [ -f "install-frp.sh" ] && echo "✅ install-frp.sh exists" || echo "❌ install-frp.sh missing"
        [ -f "install-nginx.sh" ] && echo "✅ install-nginx.sh exists" || echo "❌ install-nginx.sh missing"
        [ -f "generate-ssh-keys.sh" ] && echo "✅ generate-ssh-keys.sh exists" || echo "❌ generate-ssh-keys.sh missing"
        [ -f "test.sh" ] && echo "✅ test.sh exists" || echo "❌ test.sh missing"
        [ -f "check-system.sh" ] && echo "✅ check-system.sh exists" || echo "❌ check-system.sh missing"
        [ -f "Dockerfile" ] && echo "✅ Dockerfile exists" || echo "❌ Dockerfile missing"
        [ -f "index.html" ] && echo "✅ index.html exists" || echo "❌ index.html missing"
        [ -f "nginx.conf" ] && echo "✅ nginx.conf exists" || echo "❌ nginx.conf missing"
        [ -f "nginx-docker.conf" ] && echo "✅ nginx-docker.conf exists" || echo "❌ nginx-docker.conf missing"
        
    - name: Run custom tests
      run: |
        echo "Running custom tests..."
        if [ -f "test.sh" ]; then
          echo "✅ test.sh exists, running tests..."
          chmod +x test.sh
          ./test.sh
        else
          echo "ℹ️ test.sh not found, skipping custom tests"
        fi

  docker:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Verify pushed image
      run: |
        echo "✅ Docker image successfully built and pushed to Docker Hub"
        echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab:latest"
        echo "🔖 Image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab:${{ github.sha }}"
        echo "🌐 View at: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/devops-lab"
