name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2481'
  SSH_USERNAME: 'alexey'
  ID: 'belov'
  PROXY: 'course.prafdin.ru'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "🚀 Starting deployment..."
          
          # Login to GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "📥 Pulling latest Docker image..."
          docker pull ghcr.io/leshechka228/devops-lab:latest
          
          echo "🛑 Stopping existing services on port 8181..."
          # Останавливаем старый nginx если он запущен
          sudo systemctl stop nginx 2>/dev/null || echo "nginx not running or already stopped"
          
          # Останавливаем старый контейнер
          docker stop static-site-container 2>/dev/null || echo "No container running"
          docker rm -f static-site-container 2>/dev/null || echo "No container to remove"
          
          # Принудительно освобождаем порт
          sudo fuser -k 8181/tcp 2>/dev/null || echo "Port 8181 already free"
          sleep 3
          
          # Проверяем что порт свободен
          echo "🔍 Checking port 8181..."
          if sudo netstat -tulpn | grep -q :8181; then
            echo "❌ Port 8181 is still in use!"
            sudo netstat -tulpn | grep :8181
            echo "Forcing cleanup..."
            sudo ss -tulpn | grep :8181
            exit 1
          else
            echo "✅ Port 8181 is free"
          fi
          
          echo "🎯 Starting new container..."
          docker run -d \
            --name static-site-container \
            --restart unless-stopped \
            -p 8181:8181 \
            ghcr.io/leshechka228/devops-lab:latest
          
          echo "⏳ Waiting for container to start..."
          sleep 5
          
          echo "🔍 Diagnostic information:"
          echo "1. Container status:"
          docker ps
          echo ""
          
          echo "2. Port usage:"
          sudo netstat -tulpn | grep :8181 || echo "Port 8181 not found (container might use different networking)"
          echo ""
          
          echo "3. Testing application locally..."
          if curl -s --retry 3 --retry-delay 2 http://localhost:8181 | grep -q 'belov'; then
            echo "✅ Local application is working - 'belov' found"
          else
            echo "❌ Local application check failed"
            echo "Container logs:"
            docker logs static-site-container
            echo "Trying alternative check..."
            docker exec static-site-container curl -s http://localhost:8181 | head -2
            exit 1
          fi
          
          echo "🧹 Cleaning up Docker images..."
          docker image prune -f
          
          echo "🎉 Deployment completed!"
          echo "🌐 App should be available at: http://app.${{ env.ID }}.${{ env.PROXY }}"

    - name: Verify external access
      run: |
        echo "🔍 Verifying external access..."
        APP_URL="http://app.${{ env.ID }}.${{ env.PROXY }}"
        sleep 10
        
        if curl -s -f "$APP_URL" > /dev/null; then
          echo "✅ Application is accessible at: $APP_URL"
          echo "🎉 SUCCESS: Full CI/CD with Docker and Registry is working!"
        else
          echo "⚠️  Application might not be accessible externally (check FRP config)"
          echo "But local deployment was successful ✅"
        fi
