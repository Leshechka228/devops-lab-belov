name: CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2481'
  SSH_USERNAME: 'alexey'
  ID: 'belov'
  PROXY: 'course.prafdin.ru'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "🚀 === Starting Docker deployment ==="
          
          # Login to Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          
          echo "📥 === Pulling latest Docker image ==="
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab:latest
          
          echo "🛑 === Stopping existing container ==="
          docker stop devops-app 2>/dev/null || echo "No running container found"
          docker rm devops-app 2>/dev/null || echo "No container to remove"
          
          echo "🐳 === Starting new container ==="
          docker run -d \
            --name devops-app \
            --restart unless-stopped \
            -p 8383:8383 \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab:latest
          
          echo "⏳ === Waiting for container to start ==="
          sleep 10
          
          echo "🔍 === Diagnostic information ==="
          echo "1. Container status:"
          docker ps
          echo ""
          
          echo "2. Container logs:"
          docker logs devops-app
          echo ""
          
          echo "3. Testing application..."
          if curl -s http://localhost:8383 | grep -q 'belov'; then
            echo "✅ Application is working and contains student name!"
          else
            echo "❌ Application failed or student name not found"
            docker logs devops-app
            exit 1
          fi
          
          echo "🧹 === Cleaning up ==="
          docker image prune -f
          
          echo "🎉 === Deployment completed successfully ==="
          echo "🌐 App URL: http://app.${{ env.ID }}.${{ env.PROXY }}"
