name: CD Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [ main, master, github-actions ]

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2481'
  SSH_USERNAME: 'alexey'
  APP_DIR: '/home/alexey/devops-lab'
  ID: 'belov'
  PROXY: 'course.prafdin.ru'
  REGISTRY: 'ghcr.io'
  IMAGE_NAME: 'leshechka228/devops-lab'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Docker Container
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy from Registry
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🚀 Starting Docker deployment from Registry..."
          cd ${{ env.APP_DIR }}
          
          echo "${{ secrets.PAT }}" | sudo docker login ghcr.io -u Leshechka228 --password-stdin
          
          echo "🛑 Stopping old container..."
          sudo docker stop static-site-container || true
          sudo docker rm -f static-site-container || true
          
          echo "📥 Pulling image from registry..."
          sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          echo "🎯 Starting new container..."
          sudo docker run -d \
            --name static-site-container \
            -p 8181:8181 \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          echo "🔍 Checking container status..."
          sudo docker ps | grep static-site-container
          echo "✅ Docker deployment from registry completed!"
    
    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        APP_URL="http://app.${{ env.ID }}.${{ env.PROXY }}"
        sleep 10
        if curl -s -f "$APP_URL" > /dev/null; then
          echo "✅ Application is accessible at: $APP_URL"
        else
          echo "⚠️  Application might not be accessible externally"
        fi
