name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2481'
  SSH_USERNAME: 'alexey'
  ID: 'belov'
  PROXY: 'course.prafdin.ru'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          docker pull ghcr.io/leshechka228/devops-lab:latest
          
          docker stop static-site-container 2>/dev/null || true
          docker rm -f static-site-container 2>/dev/null || true
          
          docker run -d \
            --name static-site-container \
            --restart unless-stopped \
            -p 8181:8282 \
            ghcr.io/leshechka228/devops-lab:latest
          
          sleep 5
          
          if curl -s http://localhost:8181 | grep -q 'belov'; then
            echo "✅ Application is working"
          else
            docker logs static-site-container
            exit 1
          fi
