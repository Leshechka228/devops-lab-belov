name: CD Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2481'
  SSH_USERNAME: 'alexey'
  APP_DIR: '/home/alexey/devops-lab'
  ID: 'belov'
  PROXY: 'course.prafdin.ru'
  REGISTRY: 'ghcr.io'
  IMAGE_NAME: 'leshechka228/devops-lab'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy Docker container to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🚀 Starting Docker deployment..."
          cd ${{ env.APP_DIR }}
          
          # Получаем последний образ
          echo "📥 Pulling latest Docker image..."
          sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Останавливаем старый контейнер
          echo "🛑 Stopping old container..."
          sudo docker stop static-site-container || true
          sudo docker rm -f static-site-container || true
          
          # Запускаем новый контейнер
          echo "🎯 Starting new container..."
          sudo docker run -d \
            --name static-site-container \
            -p 8181:8181 \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Проверяем что контейнер запустился
          echo "🔍 Checking container status..."
          sudo docker ps | grep static-site-container
          
          echo "✅ Docker deployment completed!"
    
    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        APP_URL="http://app.${{ env.ID }}.${{ env.PROXY }}"
        
        # Ждем пока приложение поднимется
        sleep 10
        
        # Проверяем доступность
        if curl -s -f "$APP_URL" > /dev/null; then
          echo "✅ Application is accessible at: $APP_URL"
        else
          echo "❌ Application is not accessible at: $APP_URL"
          exit 1
        fi
        
        # Дополнительная проверка через localhost
        echo "🔍 Checking localhost access..."
        curl -s "http://localhost:8181" | grep -q "belov" && echo "✅ Content verified - 'belov' found" || echo "❌ Content verification failed"
